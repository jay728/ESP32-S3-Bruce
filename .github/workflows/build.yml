
name: Smoochiee Board Firmware Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Smoochiee Board
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      
      - name: Build Smoochiee Board Firmware
  run: |
    for attempt in 1 2 3 4; do
      echo "Build attempt $attempt of 4"

      if pio run -e smoochiee-board; then
        echo "Build successful!"
        exit 0
      fi

      echo "Build failed. Retrying in 20 seconds..."
      sleep 20
    done

    echo "Build failed after 4 attempts."
    exit 1

      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: Smoochiee-Board-Firmware
          path: .pio/build/smoochiee-board/*.bin
          if-no-files-found: error
          retention-days: 30
